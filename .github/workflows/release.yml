name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode (macOS 26 SDK for Liquid Glass)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Brisa-*.dmg --title "Brisa $GITHUB_REF_NAME" --generate-notes
