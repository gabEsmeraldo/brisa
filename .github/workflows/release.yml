name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Brisa-*.dmg --title "Brisa $GITHUB_REF_NAME" --generate-notes
